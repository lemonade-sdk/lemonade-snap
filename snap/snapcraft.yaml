name: lemonade-desktop
summary: Desktop client for local AI chat powered by lemonade-server
title: Lemonade Desktop
description: |
  Lemonade is a desktop chat interface for interacting with large language
  models (LLMs) running locally on your machine. It provides a clean,
  user-friendly interface for AI conversations with support for GPU and NPU
  acceleration.

  **Requirements**

  This snap requires the lemonade-server snap to be installed and running.
  The server provides the AI backend that powers this desktop client.

  To install lemonade-server:

    sudo snap install lemonade-server

  The server starts automatically after installation. You can verify it is
  running with:

    snap services lemonade-server

  The desktop client connects to lemonade-server on localhost port 13305.
  Ensure the server is running before launching the desktop client.

  **Features**

  - Modern chat interface for AI conversations
  - Hardware-accelerated inference on GPUs and NPUs
  - Runs entirely on your local machine for privacy
  - Native Wayland and X11 support

adopt-info: lemonade-desktop
grade: stable
confinement: strict
base: core24
contact: https://github.com/lemonade-sdk/lemonade-snap/issues
issues: https://github.com/lemonade-sdk/lemonade-snap/issues
website: https://github.com/lemonade-sdk/lemonade-snap
source-code: https://github.com/lemonade-sdk/lemonade
license: Apache-2.0
compression: lzo

platforms:
  amd64:
  arm64:

parts:
  lemonade-desktop:
    plugin: nil
    source: https://github.com/lemonade-sdk/lemonade.git
    source-type: git
    source-tag: v2026.39.1
    source-subdir: src/app
    build-snaps:
      - node/22/stable
    build-packages:
      - git
      - curl
      - libelf-dev
    override-pull: |
      craftctl default
      VERSION=$(craftctl get version)
      if [ -z $VERSION ]; then
        VERSION=$(git describe --tags --abbrev=10)
        craftctl set version=$VERSION
      fi
    override-build: |
      set +u # For unbound variables
      # workaround for build.snapcraft.io builds
      # https://bugs.launchpad.net/bugs/1886861
      if [ -n "$http_proxy" ]; then
        export GLOBAL_AGENT_HTTP_PROXY="${http_proxy}"
        export GLOBAL_AGENT_HTTPS_PROXY="${http_proxy}"
      fi

      # Install Rust via rustup so the build matches upstream's pinned toolchain.
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup"
      export CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
      export PATH="$CARGO_HOME/bin:/snap/node/current/bin:$PATH"

      # On arm64, the gnome-46-2404-sdk is missing libelf.so.1 (needed by libdw.so.1).
      # Tell the linker to also search the system library path for transitive deps.
      export RUSTFLAGS="-Wl,-rpath-link,/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"

      export npm_config_loglevel="error"
      export npm_config_progress="false"
      export npm_config_fund="false"
      export npm_config_audit="false"
      export npm_config_update_notifier="false"
      export NO_UPDATE_NOTIFIER="1"

      cd $CRAFT_PART_BUILD/src/app
      npm install
      npx tauri build --no-bundle

      mkdir -p $CRAFT_PART_INSTALL/bin
      cp src-tauri/target/release/lemonade-app $CRAFT_PART_INSTALL/bin/
      cp -rp assets $CRAFT_PART_INSTALL/
    prime:
      - -assets/favicon.ico
      - assets
      - bin/lemonade-app

  scripts:
    plugin: dump
    source: scripts
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/bin/
      cp launcher $CRAFT_PART_INSTALL/bin/
      cp lemonade-server $CRAFT_PART_INSTALL/bin/

  deps:
    plugin: nil
    stage-packages:
      - curl

  cleanup:
    after: [ lemonade-desktop ]
    plugin: nil
    build-snaps: [ gnome-46-2404 ]
    override-prime: |
        set -eux
        cd /snap/gnome-46-2404/current
        find . -type f,l -exec rm -f $SNAPCRAFT_PRIME/{} \;

slots:
  # Pseudo content slot so the transitional lemonade snap can express a
  # runtime dependency on lemonade-desktop via the content interface.
  lemonade-desktop:
    interface: content
    content: lemonade-desktop
    read:
      - $SNAP/meta/snap.yaml

plugs:
  shmem:
    interface: shared-memory
    private: true
  lemonade-server:
    interface: content
    content: foo
    target: $SNAP_DATA/foo
    default-provider: lemonade-server

apps:
  lemonade-desktop:
    extensions: [gnome]
    command: bin/launcher
    plugs:
      - audio-playback
      - audio-record
      - home
      - network
      - network-bind
      - network-status
      - shmem
      - browser-support
      - hardware-observe
      - system-observe
    environment:
      GTK_USE_PORTAL: 1
      TMPDIR: $XDG_RUNTIME_DIR
      HOME: $SNAP_USER_COMMON
      AMDGPU_ASIC_ID_TABLE_PATH: $SNAP/gpu-2404/libdrm/amdgpu.ids
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
